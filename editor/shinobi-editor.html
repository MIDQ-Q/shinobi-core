<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinobi Editor v2.1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #14151f; --bg2: #1c1e2b; --bg3: #262939; --br: #33364a;
      --tx: #e8e9f0; --tx2: #9a9db0; --ac: #ff6b35; --ac2: #ffa500;
      --ok: #4ade80; --warn: #facc15; --err: #f87171;
    }
    body { background: var(--bg); color: var(--tx); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
    header { background: linear-gradient(135deg, var(--bg2), var(--bg3)); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--br); flex-wrap: wrap; gap: 8px; }
    header h1 { font-size: 20px; background: linear-gradient(135deg, var(--ac), var(--ac2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    header h1 span { font-size: 12px; color: var(--tx2); -webkit-text-fill-color: var(--tx2); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select { background: var(--bg3); color: var(--tx); border: 1px solid var(--br); border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
    button:hover { border-color: var(--ac); transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, var(--ac), var(--ac2)); border: none; color: #fff; font-weight: 600; }
    nav { display: flex; gap: 4px; padding: 8px 20px; background: var(--bg2); border-bottom: 1px solid var(--br); overflow-x: auto; }
    nav button { border: none; background: transparent; color: var(--tx2); padding: 8px 14px; border-radius: 6px 6px 0 0; }
    nav button.active { background: var(--bg3); color: var(--ac); border: 1px solid var(--br); border-bottom: none; }
    .layout { display: flex; gap: 0; height: calc(100vh - 110px); }
    main { flex: 1; overflow-y: auto; padding: 20px; }
    aside { width: 400px; border-left: 1px solid var(--br); background: var(--bg2); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg3); border: 1px solid var(--br); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ac); margin-bottom: 10px; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .row label { width: 150px; color: var(--tx2); font-size: 13px; }
    .row input[type="text"], .row input[type="number"], .row select { flex: 1; min-width: 120px; background: var(--bg); border: 1px solid var(--br); color: var(--tx); border-radius: 5px; padding: 6px 9px; }
    .row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--ac); }
    .row input[type="color"] { width: 50px; height: 30px; background: none; border: 1px solid var(--br); border-radius: 5px; }
    .q { color: var(--ac2); cursor: help; font-size: 11px; }
    .effect-card { background: var(--bg); border-left: 3px solid var(--ac); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .prop-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border: 1px solid var(--br); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
    .prop-item .warn { color: var(--warn); font-size: 12px; }
    #validation { font-size: 13px; }
    #validation .err { color: var(--err); }
    #validation .warn { color: var(--warn); }
    #validation .ok { color: var(--ok); }
    #json { background: var(--bg); border: 1px solid var(--br); border-radius: 6px; padding: 10px; font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; max-height: 40vh; overflow: auto; color: #a5b4fc; }
    canvas { background: var(--bg); border: 1px solid var(--br); border-radius: 6px; width: 100%; }
    .small { font-size: 12px; color: var(--tx2); }
    .del { background: var(--err); border: none; color: #fff; border-radius: 4px; padding: 3px 8px; font-size: 11px; }
    h2.sec { font-size: 16px; margin-bottom: 12px; color: var(--tx); }
  </style>
</head>

    <h1>🍥 Shinobi Editor <span>v2.1 — честный предпросмотр + RU</span></h1>
    <div class="actions">
      <select id="templates">
        <option value="">📜 Шаблоны...</option>
        <option value="fireball">Огненный шар</option>
        <option value="rasengan">Расенган</option>
        <option value="chidori">Чидори</option>
        <option value="shadow">Теневые путы</option>

      <button id="btnOpen">📂 Открыть JSON</button>
      <button id="btnFolder">📁 Папка мода</button>
      <button id="btnSave" class="btn-primary">💾 Сохранить в папку</button>
      <button id="btnDownload">⬇ Скачать JSON</button>
    </div>
  </header>
  <nav id="tabs"></nav>
  <div class="layout">
    <main id="panel"></main>
    <aside>

      <div>
        <h2 class="sec">JSON</h2>
        <pre id="json"></pre>
      </div>
    </aside>
  </div>

    // ================= СХЕМЫ =================

    const ELEMENTS = { none: "Нет", fire: "Огонь", water: "Вода", wind: "Ветер", earth: "Земля", lightning: "Молния", yin: "Инь", yang: "Ян" };
    const ELCOLOR = { fire: "#ff6600", water: "#4488ff", wind: "#88ddaa", earth: "#bb8844", lightning: "#ffff44", yin: "#cc66ff", yang: "#ffffff", none: "#888888" };

    const TABS = [["meta","Мета"],["form","Форма"],["effects","Эффекты"],["props","Свойства"],["element","Стихия"],["act","Активация"],["cost","Цена"],["req","Требования"],["lvl","Уровни"],["vis","Визуал"]];

    let state = defaultState();
    let activeTab = "form";
    let dirHandle = null;

    function defaultState() {
      return { id: "shinobicore:custom_jutsu", name: "Custom Jutsu", description: "", category: "elemental_ninjutsu", rank: "C", tags: [], form: { type: "projectile", params: {} }, effects: [], properties: [], element: "none", activation: { type: "instant", params: {} }, cost: { chakra: 30 }, requirements: {}, leveling: { maxLevel: 15, levels: {} }, visual: {}, sound: {} };
    }

    function setByPath(p, v) {
      const ks = p.split(".");
      let o = state;
      for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
      o[ks[ks.length - 1]] = v;
    }

    function label(k) {
      return '<label title="' + D(k) + '">' + L(k) + ' <span class="q">ⓘ</span></label>';
    }

    function paramInputs(schema, obj, prefix) {
      let h = "";
      for (const [k, spec] of Object.entries(schema)) {
        const tp = spec[0], def = spec[1];
        const val = obj[k] != null ? obj[k] : def;
        const p = prefix + "." + k;
        if (tp === "num") h += '<div class="row">' + label(k) + '<input type="number" step="any" data-t="num" data-p="' + p + '" value="' + val + '"></div>';
        else if (tp === "str") h += '<div class="row">' + label(k) + '<input type="text" data-p="' + p + '" value="' + val + '"></div>';
        else if (tp === "bool") h += '<div class="row">' + label(k) + '<input type="checkbox" data-p="' + p + '" ' + (val ? "checked" : "") + '></div>';
        else if (tp === "sel") {
          h += '<div class="row">' + label(k) + '<select data-p="' + p + '">';
          for (const o of def) h += '<option ' + (o === val ? "selected" : "") + '>' + o + '</option>';
          h += '</select></div>';
        }
      }
      return h;

    function clean(o) {
      if (Array.isArray(o)) return o.map(clean).filter(function(x){return x!==undefined;});
      if (o && typeof o === "object") {
        const r = {};
        for (const [k, v] of Object.entries(o)) {
          const c = clean(v);
          if (c !== "" && c !== null && c !== undefined && !(typeof c === "object" && c !== null && !Array.isArray(c) && Object.keys(c).length === 0)) r[k] = c;
        }
        return r;
      }
      return o;
    }

    function serialize() {
      const s = JSON.parse(JSON.stringify(state));
      if (!s.tags || !s.tags.length) delete s.tags;
      if (!s.properties || !s.properties.length) delete s.properties;
      if (!s.requirements || !Object.keys(clean(s.requirements)).length) delete s.requirements;
      if (!Object.keys(clean(s.visual)).length) delete s.visual;
      if (!Object.keys(clean(s.sound)).length) delete s.sound;
      if (!Object.keys(s.leveling.levels).length) delete s.leveling.levels;
      if (!Object.keys(s.leveling).length) delete s.leveling;
      s.cost = clean(s.cost);
      if (!Object.keys(s.cost).length) delete s.cost;
      return s;
    }

    function validate() {
      const e = [], w = [];
      if (!state.id || state.id.indexOf(":") === -1) e.push("ID должен быть в формате modid:name");
      if (!state.name) e.push("Название обязательно");
      if (state.effects.length === 0) e.push("Нужен хотя бы 1 эффект");
      if (state.effects.length > 3) e.push("Максимум 3 эффекта");
      state.properties.forEach(function(pr){
        const m = PROPS[pr.id];
        if (m && m.forms.indexOf("all") === -1 && m.forms.indexOf(state.form.type) === -1) w.push('Свойство "' + m.name + '" несовместимо с формой ' + state.form.type);
      });
      if ((!state.cost || !state.cost.chakra) && state.activation.type !== "passive") w.push("Стоимость чакры = 0");
      if (state.leveling.maxLevel < 1 || state.leveling.maxLevel > 15) e.push("Макс. уровень 1-15");
      return { e: e, w: w };
    }

    // ================= ЧЕСТНЫЙ ПРЕДПРОСМОТР =================
    function draw() {
      const c = $("#preview"), x = c.getContext("2d");
      x.clearRect(0, 0, c.width, c.height);
      x.strokeStyle = "#20222f"; x.lineWidth = 1;
      for (let i = 0; i < c.width; i += 20) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, c.height); x.stroke(); }
      for (let i = 0; i < c.height; i += 20) { x.beginPath(); x.moveTo(0, i); x.lineTo(c.width, i); x.stroke(); }
      const col = ELCOLOR[state.element] || "#888";
      const f = state.form;
      const P = function(k){ return f.params[k] != null ? f.params[k] : (FORMS[f.type].params[k] ? FORMS[f.type].params[k][1] : 0); };
      // игрок
      x.fillStyle = "#fff"; x.fillRect(22, 148, 8, 22);
      x.fillStyle = "#ddd"; x.fillRect(24, 142, 5, 6);
      x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 2;
      let note = "";

      if (f.type === "projectile") {
        // пунктирная линия прицела (горизонт) — как в игре
        x.save(); x.setLineDash([4, 4]); x.strokeStyle = "#3a3d52";
        x.beginPath(); x.moveTo(32, 145); x.lineTo(c.width - 8, 145); x.stroke(); x.restore();
        let px = 32, py = 145;
        let vx = P("speed") * 2;   // 1 блок = 2px
        let vy = 0;                // запуск ГОРИЗОНТАЛЬНО (по прицелу), как в игре
        const g = P("gravity") * 2;
        x.strokeStyle = col;
        x.beginPath(); x.moveTo(px, py);
        for (let t = 0; t < P("lifetime"); t++) {
          px += vx; vy += g; py += vy;
          if (px > c.width - 8 || py > c.height - 8) break;
          x.lineTo(px, py);
        }
        x.stroke();
        x.beginPath(); x.arc(Math.min(px, c.width - 8), Math.min(py, c.height - 8), 3 + P("size") * 4, 0, 7); x.fill();
        if (state.properties.some(function(p){return p.id==="explode_on_hit";})) {
          const pr = state.properties.find(function(p){return p.id==="explode_on_hit";});
          x.globalAlpha = 0.4; x.beginPath();
          x.arc(Math.min(px, c.width - 8), Math.min(py, c.height - 8), (pr.params.radius || 3) * 6, 0, 7);
          x.stroke(); x.globalAlpha = 1;
        }
        note = (P("gravity") === 0) ? "✅ gravity=0: летит ровно по прицелу" : "Пунктир = линия прицела. Запуск горизонтальный, как в игре.";
      } else if (f.type === "zone") {
        x.globalAlpha = 0.35; x.beginPath(); x.arc(150, 150, P("radius") * 8, 0, 7); x.fill();
        x.globalAlpha = 1; x.beginPath(); x.arc(150, 150, P("radius") * 8, 0, 7); x.stroke();
        note = "Зона радиусом " + P("radius") + " блоков вокруг точки каста";
      } else if (f.type === "dash") {
        x.beginPath(); x.moveTo(32, 155); x.lineTo(32 + P("distance") * 10, 155); x.stroke();
        x.beginPath(); x.moveTo(32 + P("distance") * 10, 155); x.lineTo(32 + P("distance") * 10 - 8, 149); x.lineTo(32 + P("distance") * 10 - 8, 161); x.fill();
        note = "Рывок " + P("distance") + " блоков по прицелу";
      } else if (f.type === "beam") {
        x.beginPath(); x.moveTo(32, 150); x.lineTo(32 + P("maxRange") * 10, 150);
        x.lineWidth = P("width") * 3; x.stroke(); x.lineWidth = 2;
        note = "Луч длиной " + P("maxRange") + " блоков";
      } else if (f.type === "handheld") {
        const r = 6 + P("size") * 5;
        x.beginPath(); x.arc(40, 150, r, 0, 7); x.fill();
        for (let i = 0; i < 3; i++) { x.beginPath(); x.arc(40, 150, r + 3 + i * 3, 0.2 * i, 0.2 * i + 4); x.stroke(); }
        note = "Сфера в руке, заряд " + P("chargeTime") + " тиков";
      } else if (f.type === "construct") {
        x.fillRect(60, 150 - P("height") * 8, P("width") * 8, P("height") * 8);
        x.strokeRect(60, 150 - P("height") * 8, P("width") * 8, P("height") * 8);
        note = "Стена " + P("width") + "×" + P("height") + " блоков";
      } else if (f.type === "summon") {
        for (let i = 0; i < Math.min(P("count"), 5); i++) { x.beginPath(); x.arc(70 + i * 24, 150, 8, 0, 7); x.fill(); }
        note = "Призыв: " + P("count") + " сущ.";
      } else {
        x.beginPath(); x.arc(40, 150, 10, 0, 7); x.fill();
        note = "Эффект на себе/цели";
      }
      $("#previewNote").textContent = note;
    }

    function update() {
      $("#json").textContent = JSON.stringify(serialize(), null, 2);
      const v = validate();
      let h = "";
      if (v.e.length) v.e.forEach(function(m){ h += '<div class="err">❌ ' + m + '</div>'; });
      if (v.w.length) v.w.forEach(function(m){ h += '<div class="warn">⚠ ' + m + '</div>'; });
      if (!v.e.length && !v.w.length) h = '<div class="ok">✅ Техника валидна</div>';
      $("#validation").innerHTML = '<h2 class="sec">Валидация</h2>' + h;
      draw();
    }

    document.addEventListener("input", function(e) {
      const t = e.target;
      if (!t.dataset || !t.dataset.p) return;
      let v;
      if (t.type === "checkbox") v = t.checked;
      else if (t.dataset.t === "num") v = t.value === "" ? undefined : parseFloat(t.value);
      else v = t.value;
      if (t.dataset.p === "tags") state.tags = v.split(",").map(function(s){return s.trim();}).filter(Boolean);
      else setByPath(t.dataset.p, v);
      update();
    });
    document.addEventListener("change", function(e) {
      const t = e.target;
      if (!t.dataset || !t.dataset.p) return;
      let v;
      if (t.type === "checkbox") v = t.checked;
      else if (t.dataset.t === "num") v = t.value === "" ? undefined : parseFloat(t.value);
      else v = t.value;
      if (t.dataset.p === "form.type") state.form = { type: v, params: {} };
      else setByPath(t.dataset.p, v);
      render();
    });
    $("#tabs").addEventListener("click", function(e) {
      const b = e.target.closest("button");
      if (!b) return;
      activeTab = b.dataset.tab;
      render();
    });
    $("#panel").addEventListener("click", function(e) {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      const act = b.dataset.act, i = +b.dataset.i;
      if (act === "addEffect") { const tp = $("#newEffectType").value; state.effects.push({ type: tp, subtype: Object.keys(EFFECTS[tp].subs)[0], params: {} }); }
      if (act === "delEffect") state.effects.splice(i, 1);
      if (act === "addProp") { const id = $("#newProp").value; if (!state.properties.some(function(p){return p.id===id;})) state.properties.push({ id: id, params: {} }); }
      if (act === "delProp") state.properties.splice(i, 1);
      if (act === "addLevel") { const lv = $("#newLevel").value; if (!state.leveling.levels[lv]) state.leveling.levels[lv] = {}; }
      if (act === "delLevel") delete state.leveling.levels[b.dataset.i];
      render();
    });
    $("#templates").addEventListener("change", function(e) {
      const v = e.target.value;
      if (TEMPLATES[v]) { state = JSON.parse(JSON.stringify(TEMPLATES[v])); render(); }
      e.target.value = "";
    });

    function fileName() { return (state.id.split(":")[1] || "jutsu") + ".json"; }
    function jsonText() { return JSON.stringify(serialize(), null, 2); }
    $("#btnDownload").addEventListener("click", function() {
      const b = new Blob([jsonText()], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = fileName();
      a.click();
    });
    $("#btnFolder").addEventListener("click", async function() {
      if (!window.showDirectoryPicker) { alert("Используй Chrome/Edge или кнопку Скачать."); return; }
      dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      alert("Папка выбрана: " + dirHandle.name);
    });
    $("#btnSave").addEventListener("click", async function() {
      try {
        if (!window.showDirectoryPicker) { $("#btnDownload").click(); return; }
        if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        const fh = await dirHandle.getFileHandle(fileName(), { create: true });
        const w = await fh.createWritable();
        await w.write(jsonText());
        await w.close();
        alert("Сохранено: " + fileName());
      } catch (err) { alert("Ошибка сохранения: " + err); }
    });
    $("#btnOpen").addEventListener("click", async function() {
      try {
        const handles = await window.showOpenFilePicker({ types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
        const f = await handles[0].getFile();
        state = Object.assign(defaultState(), JSON.parse(await f.text()));
        render();
      } catch (err) { if (err.name !== "AbortError") alert("Ошибка открытия: " + err); }
    });

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Shinobi Editor v3.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#14151f;--bg2:#1c1e2b;--bg3:#262939;--br:#33364a;--tx:#e8e9f0;--tx2:#9a9db0;--ac:#ff6b35;--ac2:#ffa500;--ok:#4ade80;--warn:#facc15;--err:#f87171;--soon:#6b7280}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
header{background:linear-gradient(135deg,var(--bg2),var(--bg3));padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--br);flex-wrap:wrap;gap:8px}
header h1{font-size:19px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.actions{display:flex;gap:6px;flex-wrap:wrap}
button,select,input[type=number],input[type=text]{background:var(--bg3);color:var(--tx);border:1px solid var(--br);border-radius:6px;padding:6px 10px;font-size:13px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
.btn-primary{background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;color:#fff;font-weight:600}
nav{display:flex;gap:4px;padding:6px 16px;background:var(--bg2);border-bottom:1px solid var(--br);overflow-x:auto}
nav button{border:none;background:transparent;color:var(--tx2);padding:7px 12px;border-radius:6px 6px 0 0}
nav button.active{background:var(--bg3);color:var(--ac);border:1px solid var(--br);border-bottom:none}
.layout{display:flex;height:calc(100vh - 96px)}
main{flex:1;overflow-y:auto;padding:16px}
aside{width:420px;border-left:1px solid var(--br);background:var(--bg2);overflow-y:auto;padding:12px}
.card{background:var(--bg3);border:1px solid var(--br);border-radius:8px;padding:12px;margin-bottom:12px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ac);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.row label{width:150px;color:var(--tx2);font-size:13px}
.row input[type=text],.row input[type=number],.row select{flex:1;min-width:110px}
.row input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac)}
.q{color:var(--ac2);cursor:help;font-size:11px}
.soon{background:var(--soon);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;margin-left:6px}
.effect-card{background:var(--bg);border-left:3px solid var(--ac);border-radius:6px;padding:9px;margin-bottom:9px}
.prop-item{background:var(--bg);border:1px solid var(--br);border-radius:6px;padding:7px 9px;margin-bottom:6px}
.warn{color:var(--warn);font-size:12px}
#validation{font-size:13px}
#validation .err{color:var(--err)}#validation .warn{color:var(--warn)}#validation .ok{color:var(--ok)}
#json{background:var(--bg);border:1px solid var(--br);border-radius:6px;padding:8px;font-family:Consolas,monospace;font-size:10.5px;white-space:pre-wrap;max-height:36vh;overflow:auto;color:#a5b4fc}
canvas{background:var(--bg);border:1px solid var(--br);border-radius:6px;width:100%}
.small{font-size:12px;color:var(--tx2)}
.del{background:var(--err);border:none;color:#fff;border-radius:4px;padding:2px 7px;font-size:11px}
h2.sec{font-size:15px;margin-bottom:10px}
.pv-title{font-size:12px;color:var(--tx2);margin:6px 0 3px}
</style>
</head>
<body>
<header>
<h1>🍥 Shinobi Editor <span style="font-size:11px;color:var(--tx2)">v3.1</span></h1>
<div class="actions">
<select id="templates"><option value="">📜 Шаблоны...</option><option value="fireball">Огненный шар</option><option value="rasengan">Расенган</option><option value="chidori">Чидори</option><option value="shadow">Теневые путы</option></select>
<button id="btnOpen">📂 JSON</button>
<button id="btnJDir">📁 Техники</button>
<button id="btnADir">📁 Ассеты</button>
<button id="btnSave" class="btn-primary">💾 Сохранить</button>
<button id="btnDl">⬇ Скачать</button>
</div>
</header>
<nav id="tabs"></nav>
<div class="layout">
<main id="panel"></main>
<aside>
<div class="pv-title">БОКОВАЯ ПРОЕКЦИЯ (X=дальность, Y=высота, блоки)</div>
<canvas id="pvSide" width="396" height="170"></canvas>
<div class="pv-title">ВИД СВЕРХУ (X/Z, блоки)</div>
<canvas id="pvTop" width="396" height="170"></canvas>
<div id="validation" style="margin-top:8px"></div>
<div class="pv-title">JSON</div>
<pre id="json"></pre>
</aside>
</div>

wn:["Кулдаун","Секунды между кастами"],chakra:["Чакра","Стоимость"],fatigue:["Усталость","Стоимость"],uses:["Использований","Нужно для уровня"],sp:["SP","Очки навыков"],ninjutsu:["Ниндзюцу","Стат"],control:["Контроль","Стат"],dojutsu:["Додзюцу","Требование"],damage:["Урон","Значение на уровне"],cost:["Цена","Чакра на уровне"],particle:["Частица",""],color:["Цвет",""],scale:["Масштаб",""],glow:["Свечение",""],cast:["Каст","Звук"],hit:["Попадание","Звук"]};
const VAL={self:"на себя",touch:"вплотную",look_entity:"кого вижу",raycast_point:"точка прицела",on_hit:"при ударе",on_release:"при релизе",on_timeout:"по таймеру",fight_for_caster:"атакует врагов",protect_caster:"защищает",passive:"пассивен",kamikaze:"камикадзе",follow:"следует",sphere:"сфера",cylinder:"цилиндр",box:"куб",wall:"стена",dome:"купол",cage:"клетка",pillar:"колонна",platform:"платформа",instant:"мгновенно",handseals:"печати",charge:"зарядка",hold:"канал",combo:"комбо",counter:"контратака",on_death:"при смерти",conditional:"условие"};

handheld:{n:"В руке",p:{chargeTime:["num",40],holdDuration:["num",400],activation:["sel",["on_hit","on_release","on_timeout"]],size:["num",1],voxelModel:["str",""],throwable:["bool",false]}}};

buff:{n:"Бафф",subs:{heal:{amount:["num",8]},regen:{rate:["num",1],duration:["num",100]},chakra_regen:{rate:["num",1],duration:["num",100]},shield:{amount:["num",10],duration:["num",100]},speed:{bonus:["num",0.3],duration:["num",100]},strength:{bonus:["num",0.3],duration:["num",100]},resistance:{percent:["num",20],duration:["num",100]},haste:{bonus:["num",0.3],duration:["num",100]},invisibility:{duration:["num",100]},purify:{count:["num",1]}}},
debuff:{n:"Дебафф",subs:{burn:{dps:["num",1],duration:["num",60]},poison:{dps:["num",1],duration:["num",60]},slow:{percent:["num",30],duration:["num",60]},weakness:{percent:["num",20],duration:["num",60]},vulnerability:{percent:["num",20],duration:["num",60]},bleed:{dps:["num",1],duration:["num",60]},curse:{dps:["num",1],duration:["num",100]},exhaustion:{amount:["num",10]},chakra_drain:{rate:["num",1],duration:["num",60]}}},
world:{n:"Мир",subs:{place_block:{blockType:["str","stone"],duration:["num",200]},remove_block:{area:["num",3]},transform_block:{from:["str","minecraft:dirt"],to:["str","minecraft:grass_block"],area:["num",3]},ignite:{area:["num",3]},freeze:{area:["num",3]},create_entity:{entityType:["str","minecraft:armor_stand"]}}}};
const PROPS={
trajectory_straight:{n:"Прямая",f:["projectile"],p:{}},trajectory_arc:{n:"Дуга",f:["projectile"],p:{arcHeight:["num",3]}},trajectory_spiral:{n:"Спираль",f:["projectile"],p:{spiralRate:["num",0.2],amplitude:["num",0.6]}},trajectory_wave:{n:"Волна",f:["projectile"],p:{amplitude:["num",1],frequency:["num",0.3]}},homing:{n:"Самонаведение",f:["projectile"],p:{turnRate:["num",0.15]}},piercing:{n:"Пробивание",f:["projectile","beam"],p:{count:["num",3]}},bouncing:{n:"Рикошет",f:["projectile"],p:{count:["num",2]}},splitting:{n:"Разделение",f:["projectile"],p:{count:["num",3],angle:["num",30]}},chaining:{n:"Цепь",f:["projectile"],p:{count:["num",3],range:["num",4]}},orbiting:{n:"Орбита",f:["projectile"],p:{radius:["num",2],count:["num",4]}},volley:{n:"Залп",f:["projectile"],p:{count:["num",5],spreadAngle:["num",30]}},gravity_affected:{n:"Гравитация+",f:["projectile"],p:{strength:["num",2]}},no_gravity:{n:"Без гравитации",f:["projectile"],p:{}},explode_on_hit:{n:"Взрыв при попадании",f:["projectile","dash","handheld"],p:{radius:["num",3],damage:["num",8],knockback:["num",0.5]}},stick_on_hit:{n:"Прилипание",f:["projectile"],p:{duration:["num",100]}},delayed_explosion:{n:"Отложенный взрыв",f:["projectile","zone"],p:{delay:["num",20],radius:["num",3],damage:["num",8]}},chain_explosion:{n:"Цепной взрыв",f:["projectile","zone"],p:{count:["num",2],radius:["num",2]}},implosion:{n:"Имплозия",f:["projectile","zone"],p:{radius:["num",3],pullForce:["num",2]}},multi_target:{n:"Макс. целей",f:["all"],p:{count:["num",3]}},self_target:{n:"На себя",f:["point","zone"],p:{}},silent:{n:"Без звука",f:["all"],p:{}},invisible_projectile:{n:"Невидимый",f:["projectile"],p:{}},unblockable:{n:"Не блокируется",f:["all"],p:{}},unreflectable:{n:"Не отражается",f:["all"],p:{}},lifesteal:{n:"Вампиризм",f:["all"],p:{percent:["num",50]}},chakra_drain_on_hit:{n:"Кража чакры",f:["all"],p:{amount:["num",10]}},execute_bonus:{n:"Бонус казни",f:["all"],p:{threshold:["num",30],bonus:["num",50]}},chargeable:{n:"Заряжаемая",f:["projectile","handheld"],p:{}},interruptible:{n:"Прерываемая",f:["all"],p:{}},throwable:{n:"Бросаемая",f:["handheld"],p:{}},multi_use:{n:"Многоразовая",f:["handheld"],p:{}},channeled:{n:"Канал",f:["beam","zone"],p:{chakraPerTick:["num",0.5]}},aura:{n:"Аура (следует)",f:["zone"],p:{radius:["num",3]}},toggle:{n:"Переключаемая",f:["zone"],p:{}},permanent:{n:"Постоянная",f:["construct"],p:{}}};
const ACTS={instant:{n:"Мгновенная",p:{}},handseals:{n:"Печати",p:{sealCount:["num",3],sealSpeed:["num",1]}},charge:{n:"Зарядка",p:{minCharge:["num",20],maxCharge:["num",60]}},hold:{n:"Канал",p:{chakraPerTick:["num",0.5]}},combo:{n:"Комбо",p:{steps:["num",3],windowMs:["num",1000]}},counter:{n:"Контратака",p:{windowMs:["num",4000],damageThreshold:["num",1]}},on_death:{n:"При смерти",p:{}},passive:{n:"Пассивная",p:{}},conditional:{n:"По условию",p:{}}};
const ELEMENTS={none:"Нет",fire:"Огонь",water:"Вода",wind:"Ветер",earth:"Земля",lightning:"Молния",yin:"Инь",yang:"Ян"};
const ELCOLOR={fire:"#ff6600",water:"#4488ff",wind:"#88ddaa",earth:"#bb8844",lightning:"#ffff44",yin:"#cc66ff",yang:"#ffffff",none:"#888888"};

let state=defaultState(),activeTab="form",jutsuDir=null,assetsDir=null;
function defaultState(){return{id:"shinobicore:custom_jutsu",name:"Custom Jutsu",description:"",category:"elemental_ninjutsu",rank:"C",tags:[],form:{type:"projectile",params:{}},effects:[],properties:[],element:"none",activation:{type:"instant",params:{}},cooldown:4,cost:{chakra:30},requirements:{},leveling:{maxLevel:15,levels:{}},visual:{},sound:{}}}
function normalize(s){const d=defaultState();const o=Object.assign(d,s);
o.form=o.form&&typeof o.form==="object"?o.form:{type:"projectile",params:{}};o.form.params=o.form.params||{};
if(!FORMS[o.form.type])o.form.type="projectile";
o.effects=Array.isArray(o.effects)?o.effects:[];o.properties=Array.isArray(o.properties)?o.properties:[];

if(!ACTS[o.activation.type])o.activation.type="instant";

function setByPath(p,v){const ks=p.split(".");let o=state;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=="object")o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}
function badge(key,list){return list&&list.indexOf(key)>=0?'<span class="soon">скоро в игре</span>':""}
function opt(v,cur){return '<option value="'+v+'"'+(v===cur?" selected":"")+'>'+(VAL[v]||v)+"</option>"}
function paramInputs(schema,obj,prefix,soonList){obj=obj||{};let h="";for(const k in schema){const spec=schema[k],tp=spec[0],def=spec[1],val=obj[k]!=null?obj[k]:def,p=prefix+"."+k;const lb='<label title="'+D(k)+'">'+L(k)+' <span class="q">i</span>'+badge(k,soonList)+"</label>";
if(tp==="num")h+='<div class="row">'+lb+'<input type="number" step="any" data-t="num" data-p="'+p+'" value="'+val+'"></div>';
else if(tp==="str")h+='<div class="row">'+lb+'<input type="text" data-p="'+p+'" value="'+val+'"></div>';
else if(tp==="bool")h+='<div class="row">'+lb+'<input type="checkbox" data-p="'+p+'"'+(val?" checked":"")+"></div>";
else h+='<div class="row">'+lb+'<select data-p="'+p+'">'+def.map(o=>opt(o,val)).join("")+"</select></div>"}return h}
function effectCard(eff,pfx,i){const subs=EFFECTS[eff.type]?EFFECTS[eff.type].subs:{};return '<div class="effect-card"><div class="row"><label>Тип</label><select data-p="'+pfx+i+'.type">'+Object.keys(EFFECTS).map(t=>opt(t,eff.type)).join("")+'</select><label>Подтип</label><select data-p="'+pfx+i+'.subtype">'+Object.keys(subs).map(s=>opt(s,eff.subtype)).join("")+'</select><button class="del" data-act="delEff" data-i="'+i+'" data-pfx="'+pfx+'">X</button></div>'+((subs[eff.subtype])?paramInputs(subs[eff.subtype],eff.params,pfx+i+".params"):"")+"</div>"}
function render(){try{
$("#tabs").innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(t[0]===activeTab?"active":"")+'">'+t[1]+"</button>").join("");
let h="";
if(activeTab==="meta"){h='<h2 class="sec">Метаданные</h2><div class="card"><div class="row"><label title="modid:name">ID <span class="q">i</span></label><input type="text" data-p="id" value="'+state.id+'"></div><div class="small">Файл сохраняется ПО ИМЕНИ ID; ID должен быть уникальным, иначе техника перезапишет существующую!</div><div class="row"><label>Название</label><input type="text" data-p="name" value="'+state.name+'"></div><div class="row"><label>Описание</label><input type="text" data-p="description" value="'+state.description+'"></div><div class="row"><label>Категория</label><select data-p="category">'+["elemental_ninjutsu","shape_ninjutsu","genjutsu","taijutsu","summoning","space_time_ninjutsu","fuinjutsu","medical"].map(c=>opt(c,state.category)).join("")+'</select></div><div class="row"><label>Ранг</label><select data-p="rank">'+["D","C","B","A","S"].map(r=>opt(r,state.rank)).join("")+'</select></div><div class="row"><label title="Через запятую">Теги <span class="q">i</span></label><input type="text" data-p="tags" value="'+state.tags.join(",")+'"></div></div>'}

function clean(o){if(Array.isArray(o))return o.map(clean).filter(x=>x!==undefined);if(o&&typeof o==="object"){const r={};for(const k in o){const c=clean(o[k]);if(c!==""&&c!==null&&c!==undefined&&!(typeof c==="object"&&c!==null&&!Array.isArray(c)&&Object.keys(c).length===0))r[k]=c}return r}return o}
function serialize(){const s=JSON.parse(JSON.stringify(normalize(JSON.parse(JSON.stringify(state)))));if(!s.tags.length)delete s.tags;if(!s.properties.length)delete s.properties;if(!Object.keys(clean(s.requirements)).length)delete s.requirements;if(!Object.keys(clean(s.visual)).length)delete s.visual;if(!Object.keys(clean(s.sound)).length)delete s.sound;const lv=s.leveling;Object.values(lv.levels).forEach(r=>{if(r.unlock){if(!r.unlock.properties||!r.unlock.properties.length)delete r.unlock.properties;if(!r.unlock.effects||!r.unlock.effects.length)delete r.unlock.effects;if(!Object.keys(r.unlock).length)delete r.unlock}});if(!Object.keys(lv.levels).length)delete lv.levels;if(!Object.keys(lv).length)delete s.leveling;s.cost=clean(s.cost);if(!Object.keys(s.cost).length)delete s.cost;if(!s.cooldown)delete s.cooldown;return s}
function validate(){const e=[],w=[];if(!state.id||state.id.indexOf(":")<0)e.push("ID в формате modid:name");if(!state.name)e.push("Название обязательно");if(state.effects.length===0)e.push("Нужен >=1 эффект");if(state.effects.length>3)e.push("Максимум 3 эффекта");state.properties.forEach(p=>{const m=PROPS[p.id];if(m&&m.f.indexOf("all")<0&&m.f.indexOf(state.form.type)<0)w.push('"'+(m?m.n:p.id)+'" не для формы '+state.form.type)});if(SOON.act.indexOf(state.activation.type)>=0)w.push("Активация "+state.activation.type+" ещё не в игре");if(state.leveling.maxLevel<1||state.leveling.maxLevel>15)e.push("Макс. уровень 1-15");return{e,w}}
const SC=6;
function grid(x,W,H,ox,oy){x.strokeStyle="#20222f";x.lineWidth=1;for(let i=0;i<=W;i+=SC*2){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<=H;i+=SC*2){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}x.strokeStyle="#3a3d52";x.beginPath();x.moveTo(ox,0);x.lineTo(ox,H);x.stroke();x.beginPath();x.moveTo(0,oy);x.lineTo(W,oy);x.stroke();x.fillStyle="#666a80";x.font="9px monospace";for(let b=4;b*SC<=W-ox;b+=4){x.fillText(b,ox+b*SC-2,H-3)}for(let b=4;b*SC<=oy;b+=4){x.fillText(b,1,oy-b*SC+9)}}
function num(v,d){const n=parseFloat(v);return isFinite(n)?n:d}
function drawSide(){try{const cv=$("#pvSide"),x=cv.getContext("2d");x.clearRect(0,0,cv.width,cv.height);const ox=30,oy=cv.height-24;grid(x,cv.width,cv.height,ox,oy);const f=state.form,P=k=>num(f.params[k],FORMS[f.type].p[k]?FORMS[f.type].p[k][1]:0);const col=ELCOLOR[state.element]||"#888";x.fillStyle="#fff";x.fillRect(ox-3,oy-14,6,14);x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2;
if(f.type==="projectile"){let px=0,py=1.6,vx=P("speed"),vy=0,g=P("gravity");const lt=Math.min(400,P("lifetime"));if(state.properties.some(p=>p.id==="trajectory_arc"))vy+=P("arcHeight")*0.08;x.beginPath();x.moveTo(ox,oy-py*SC);let ex=px,ey=py;for(let t=0;t<lt;t++){px+=vx;vy-=g;py+=vy;if(ox+px*SC>cv.width-4||oy-py*SC<4||py<0)break;ex=px;ey=py;x.lineTo(ox+px*SC,oy-py*SC)}x.stroke();x.beginPath();x.arc(ox+ex*SC,oy-ey*SC,3+P("size")*3,0,7);x.fill();const bo=state.properties.find(p=>p.id==="explode_on_hit");if(bo){x.globalAlpha=.4;x.beginPath();x.arc(ox+ex*SC,oy-ey*SC,num(bo.params.radius,3)*SC,0,7);x.stroke();x.globalAlpha=1}}
else if(f.type==="beam"){x.beginPath();x.moveTo(ox,oy-1.6*SC);x.lineTo(ox+P("maxRange")*SC,oy-1.6*SC);x.lineWidth=Math.max(2,P("width")*3);x.stroke();x.lineWidth=2}
else if(f.type==="dash"){x.beginPath();x.moveTo(ox,oy-10);x.lineTo(ox+P("distance")*SC,oy-10);x.stroke();x.beginPath();x.moveTo(ox+P("distance")*SC,oy-10);x.lineTo(ox+P("distance")*SC-7,oy-15);x.lineTo(ox+P("distance")*SC-7,oy-5);x.fill()}
else if(f.type==="zone"){x.globalAlpha=.3;x.fillRect(ox-P("radius")*SC,oy-8,P("radius")*2*SC,8);x.globalAlpha=1;x.strokeRect(ox-P("radius")*SC,oy-8,P("radius")*2*SC,8)}
else if(f.type==="construct"){x.fillRect(ox+2*SC,oy-P("height")*SC,Math.max(1,P("depth"))*SC,P("height")*SC);x.strokeRect(ox+2*SC,oy-P("height")*SC,Math.max(1,P("depth"))*SC,P("height")*SC)}
else if(f.type==="handheld"){const r=4+P("size")*4;x.beginPath();x.arc(ox+8,oy-12,r,0,7);x.fill();for(let i=0;i<3;i++){x.beginPath();x.arc(ox+8,oy-12,r+3+i*3,0.2*i,0.2*i+4);x.stroke()}}
else{x.beginPath();x.arc(ox,oy-10,8,0,7);x.fill()}
x.fillStyle="#9a9db0";x.font="9px monospace";x.fillText("form="+f.type,4,10)}catch(err){console.error(err)}}
function drawTop(){try{const cv=$("#pvTop"),x=cv.getContext("2d");x.clearRect(0,0,cv.width,cv.height);const ox=cv.width/2,oy=cv.height/2;x.strokeStyle="#20222f";x.lineWidth=1;for(let i=0;i<=cv.width;i+=SC*2){x.beginPath();x.moveTo(i,0);x.lineTo(i,cv.height);x.stroke()}for(let i=0;i<=cv.height;i+=SC*2){x.beginPath();x.moveTo(0,i);x.lineTo(cv.width,i);x.stroke()}x.strokeStyle="#3a3d52";x.beginPath();x.moveTo(ox,0);x.lineTo(ox,cv.height);x.stroke();x.beginPath();x.moveTo(0,oy);x.lineTo(cv.width,oy);x.stroke();x.fillStyle="#666a80";x.font="9px monospace";for(let b=-12;b<=12;b+=4){if(b)x.fillText(b,ox+b*SC-3,oy+10)}const f=state.form,P=k=>num(f.params[k],FORMS[f.type].p[k]?FORMS[f.type].p[k][1]:0);const col=ELCOLOR[state.element]||"#888";x.fillStyle="#fff";x.beginPath();x.arc(ox,oy,3,0,7);x.fill();x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2;
if(f.type==="projectile"){const vol=state.properties.find(p=>p.id==="volley");const n=Math.max(1,vol?num(vol.params.count,1):num(f.params.count,1));const spr=vol?num(vol.params.spreadAngle,30):num(f.params.spread,0);const len=Math.min(P("lifetime")*P("speed"),28);for(let i=0;i<n;i++){const a=(-spr/2+spr*i/Math.max(1,n-1))*Math.PI/180;x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+Math.sin(a)*len*SC,oy-Math.cos(a)*len*SC);x.stroke()}const ex=state.properties.find(p=>p.id==="explode_on_hit");if(ex){x.globalAlpha=.4;x.beginPath();x.arc(ox,oy-len*SC,num(ex.params.radius,3)*SC,0,7);x.stroke();x.globalAlpha=1}const or_=state.properties.find(p=>p.id==="orbiting");if(or_){x.beginPath();x.arc(ox,oy,num(or_.params.radius,2)*SC,0,7);x.stroke()}}
else if(f.type==="zone"){x.beginPath();x.arc(ox,oy,P("radius")*SC,0,7);x.stroke()}
else if(f.type==="construct"){x.beginPath();x.moveTo(ox-P("width")/2*SC,oy-3*SC);x.lineTo(ox+P("width")/2*SC,oy-3*SC);x.lineWidth=4;x.stroke();x.lineWidth=2}
else if(f.type==="beam"){x.beginPath();x.moveTo(ox,oy);x.lineTo(ox,oy-Math.min(P("maxRange"),26)*SC);x.stroke()}
else if(f.type==="dash"){x.beginPath();x.moveTo(ox,oy);x.lineTo(ox,oy-P("distance")*SC);x.stroke()}
else if(f.type==="handheld"){x.beginPath();x.arc(ox+6,oy-6,4+P("size")*4,0,7);x.fill()}}catch(err){console.error(err)}}
function update(){try{$("#json").textContent=JSON.stringify(serialize(),null,2);const v=validate();let h="";v.e.forEach(m=>h+='<div class="err">X '+m+"</div>");v.w.forEach(m=>h+='<div class="warn">! '+m+"</div>");if(!v.e.length&&!v.w.length)h='<div class="ok">OK Техника валидна</div>';$("#validation").innerHTML=h;drawSide();drawTop()}catch(err){console.error(err)}}
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset)return;
if(t.dataset.unlockprops){const k=t.dataset.unlockprops;const arr=t.value.split(",").map(s=>s.trim()).filter(Boolean);const lv=state.leveling.levels[k];if(lv){if(!lv.unlock)lv.unlock={};lv.unlock.properties=arr}update();return}
if(!t.dataset.p)return;let v;if(t.type==="checkbox")v=t.checked;else if(t.dataset.t==="num")v=t.value===""?undefined:parseFloat(t.value);else v=t.value;
if(t.dataset.p==="tags"){state.tags=String(v).split(",").map(s=>s.trim()).filter(Boolean)}else setByPath(t.dataset.p,v);update()});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset||!t.dataset.p)return;let v;if(t.type==="checkbox")v=t.checked;else if(t.dataset.t==="num")v=t.value===""?undefined:parseFloat(t.value);else v=t.value;
if(t.dataset.p==="form.type")state.form={type:v,params:{}};else setByPath(t.dataset.p,v);render()});

$("#panel").addEventListener("click",async e=>{const b=e.target.closest("button[data-act]");if(!b)return;const act=b.dataset.act;
if(act==="addEff"){const tp=$("#newEff").value;state.effects.push({type:tp,subtype:Object.keys(EFFECTS[tp].subs)[0],params:{}})}
else if(act==="delEff"){const i=+b.dataset.i,pfx=b.dataset.pfx;if(pfx&&pfx.indexOf("leveling")===0){const parts=pfx.split(".");const lv=state.leveling.levels[parts[2]];if(lv&&lv.unlock)lv.unlock.effects.splice(i,1)}else state.effects.splice(i,1)}
else if(act==="addProp"){const id=$("#newProp").value;if(!state.properties.some(p=>p.id===id))state.properties.push({id,params:{}})}
else if(act==="delProp")state.properties.splice(+b.dataset.i,1);
else if(act==="addLvl"){const k=$("#newLvl").value;if(!state.leveling.levels[k])state.leveling.levels[k]={}}
else if(act==="delLvl")delete state.leveling.levels[b.dataset.lvl];
else if(act==="addUnlockEff"){const k=b.dataset.lvl;const lv=state.leveling.levels[k];if(!lv.unlock)lv.unlock={};if(!lv.unlock.effects)lv.unlock.effects=[];lv.unlock.effects.push({type:"damage",subtype:"instant",params:{}})}
else if(act==="importBB")await importBB();
else if(act==="importSnd")await importSnd(b.dataset.kind);
render()});

async function importBB(){try{if(!window.showDirectoryPicker){alert("Нужен Chrome/Edge");return}const[fh]=await showOpenFilePicker({types:[{description:"Blockbench",accept:{"application/json":[".bbmodel"]}}]});const bb=JSON.parse(await(await fh.getFile()).text());const voxels=(bb.elements||[]).map(el=>({from:el.from,to:el.to,color:"#cccccc"}));const name=String(bb.name||"model").toLowerCase().replace(/\s+/g,"_");if(assetsDir){const vd=await assetsDir.getDirectoryHandle("voxels",{create:true});const out=await vd.getFileHandle(name+".json",{create:true});const w=await out.createWritable();await w.write(JSON.stringify({name,voxels},null,2));await w.close()}state.visual.voxelModel=name;alert("Импортировано вокселей: "+voxels.length)}catch(err){if(err&&err.name!=="AbortError")alert("Ошибка импорта: "+err)}}

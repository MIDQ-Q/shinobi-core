<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShinobiCore Studio</title>
<style>
/* ==========================================================================
   Палитра снята с SakuraTheme.java — те же токены, что рисует игра.
   BG_TOP #171119  PANEL #1E1624  EDGE #3A2A3E  SAKURA #FF9EC4  SAK_DIM #8A4A66
   INK #F2EAF0  INK_DIM #9A8FA6  GOLD #FFD75E  CHAKRA #7EC8FF  PAPER #E7D9BC
   ========================================================================== */
:root{
  --bg:#171119; --bg2:#100b12; --panel:#1e1624; --panel2:#241a2c; --edge:#3a2a3e;
  --sakura:#ff9ec4; --sakdim:#8a4a66; --ink:#f2eaf0; --dim:#9a8fa6; --gold:#ffd75e;
  --chakra:#7ec8ff; --violet:#b48aff; --paper:#e7d9bc; --red:#ff6b7a; --green:#7ee08a;
  --slot:#2a1f2e; --slotedge:#4a3a50;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--ink); font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#150f18}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--sakdim)}

/* ---------- каркас ---------- */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{
  display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:rgba(30,22,36,.92);border-bottom:1px solid var(--edge);
}
header .logo{font-size:16px;font-weight:600;letter-spacing:.4px;color:var(--sakura);white-space:nowrap}
header .logo small{color:var(--dim);font-weight:400;font-size:11px;margin-left:6px}
#root-label{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.spacer{flex:1}
body{display:block}
#main{display:grid;grid-template-columns:172px 1fr;min-height:0}
nav{
  background:rgba(23,17,25,.7);border-right:1px solid var(--edge);
  padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto;
}
nav button{
  text-align:left;background:none;border:1px solid transparent;border-radius:7px;
  padding:8px 10px;cursor:pointer;color:var(--dim);display:flex;align-items:center;gap:8px;
}
nav button:hover{background:var(--panel);color:var(--ink)}
nav button.on{background:var(--panel2);border-color:var(--sakdim);color:var(--sakura)}
nav button .cnt{margin-left:auto;font-size:10px;background:var(--slot);border:1px solid var(--slotedge);
  border-radius:9px;padding:0 6px;color:var(--dim)}
nav button.bad .cnt{color:var(--red);border-color:#5a2a33}
nav .sep{height:1px;background:var(--edge);margin:8px 2px}
#view{overflow:auto;padding:14px 16px 40px;min-width:0}
footer{
  border-top:1px solid var(--edge);background:rgba(30,22,36,.92);
  padding:5px 14px;font-size:11px;color:var(--dim);display:flex;gap:16px;align-items:center;
}

/* ---------- элементы ---------- */
.btn{
  background:var(--panel2);border:1px solid var(--slotedge);border-radius:7px;
  padding:5px 12px;cursor:pointer;color:var(--ink);white-space:nowrap;
}
.btn:hover{border-color:var(--sakdim);background:#2c2038}
.btn.pri{background:linear-gradient(180deg,#8a4a66,#5e3247);border-color:var(--sakura);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:2px 8px;font-size:11px;border-radius:5px}
.btn.danger{border-color:#6b2b34;color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;margin-bottom:12px}
.card>h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--sakura);font-weight:600}
.card>h3 .hint{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400;margin-left:8px;font-size:11px}
h2.title{margin:0 0 12px;font-size:17px;font-weight:600;color:var(--ink)}
h2.title .sub{font-size:11px;color:var(--dim);font-weight:400;margin-left:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.tight{gap:6px}
label.f{display:flex;flex-direction:column;gap:3px;min-width:0}
label.f>span{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
input,select,textarea{
  background:var(--slot);border:1px solid var(--slotedge);border-radius:6px;
  padding:4px 7px;outline:none;min-width:0;
}
input:focus,select:focus,textarea:focus{border-color:var(--sakura);box-shadow:0 0 0 1px rgba(255,158,196,.25)}
input[readonly]{color:var(--dim);background:#221a29}
input.bad,select.bad,textarea.bad{border-color:var(--red)}
input.warn,select.warn{border-color:var(--gold)}
textarea{resize:vertical;font-family:inherit}
.grid{display:grid;gap:9px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mono{font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:11.5px}
.dim{color:var(--dim)}
.pill{display:inline-block;border:1px solid var(--slotedge);border-radius:9px;padding:0 7px;font-size:10px;background:var(--slot);color:var(--dim)}
.pill.el{border-color:currentColor}
.tag-ok{color:var(--green)} .tag-bad{color:var(--red)} .tag-warn{color:var(--gold)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
  padding:5px 8px;border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--panel);z-index:2}
table.t td{padding:4px 8px;border-bottom:1px solid #2a2033;vertical-align:top}
table.t tr:hover td{background:#241a2c}
table.t tr.sel td{background:#33223c}

/* ---------- список техник ---------- */
.jwrap{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;gap:12px;align-items:start}
@media(max-width:1400px){.jwrap{grid-template-columns:230px minmax(0,1fr)}.jside{grid-column:1/-1}}
.jlist{max-height:calc(100vh - 170px);overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:10px}
.jlist .filters{padding:8px;border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--panel);z-index:3}
.jlist .item{padding:6px 9px;border-bottom:1px solid #241a2c;cursor:pointer;display:flex;gap:7px;align-items:center}
.jlist .item:hover{background:#241a2c}
.jlist .item.on{background:#33223c;border-left:2px solid var(--sakura);padding-left:7px}
.jlist .item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jlist .item .rk{font-size:10px;width:14px;text-align:center;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* ---------- вкладки ---------- */
.tabs{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--edge);margin-bottom:11px}
.tabs button{background:none;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;
  padding:5px 11px;cursor:pointer;color:var(--dim);font-size:12px}
.tabs button:hover{color:var(--ink);background:var(--panel)}
.tabs button.on{color:var(--sakura);background:var(--panel);border-color:var(--edge)}
.tabs button .n{font-size:9px;background:var(--slot);border-radius:8px;padding:0 5px;margin-left:5px}

/* ---------- повторяющиеся блоки ---------- */
.rep{border:1px solid var(--edge);border-radius:8px;padding:8px;margin-bottom:7px;background:#221a29;position:relative}
.rep .hd{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.rep .rm{position:absolute;top:6px;right:6px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr) 26px;gap:5px;align-items:center;margin-bottom:4px}
.kv>span{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}

/* ---------- визуализация ---------- */
.viz{background:#120d15;border:1px solid var(--edge);border-radius:10px;padding:8px}
.viz svg{display:block;width:100%;height:auto}
.vizcap{font-size:10px;color:var(--dim);margin-top:5px;line-height:1.5}
.bar{height:6px;background:var(--slot);border-radius:3px;overflow:hidden;border:1px solid var(--slotedge)}
.bar>i{display:block;height:100%}

/* ---------- дерево ---------- */
#treeWrap{overflow:auto;background:#120d15;border:1px solid var(--edge);border-radius:10px;padding:6px}
.tnode{cursor:pointer}
.tnode circle{transition:filter .12s}
.tnode:hover circle{filter:brightness(1.35)}
.tnode.sel circle{stroke:#fff;stroke-width:2}

/* ---------- уведомления ---------- */
#toast{position:fixed;right:16px;bottom:44px;display:flex;flex-direction:column;gap:7px;z-index:99}
.tst{background:var(--panel2);border:1px solid var(--sakdim);border-left:3px solid var(--sakura);
  border-radius:8px;padding:8px 13px;max-width:420px;box-shadow:0 6px 22px rgba(0,0,0,.55);animation:in .18s ease-out}
.tst.err{border-left-color:var(--red);border-color:#6b2b34}
.tst.ok{border-left-color:var(--green);border-color:#2f5c39}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.issue{padding:5px 8px;border-radius:6px;margin-bottom:4px;font-size:11.5px;border-left:3px solid}
.issue.err{background:#2a1a1e;border-color:var(--red)}
.issue.warn{background:#2a2419;border-color:var(--gold)}
.issue.info{background:#1d2430;border-color:var(--chakra)}
.issue .w{color:var(--dim);font-size:10.5px}
.kbd{background:var(--slot);border:1px solid var(--slotedge);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10.5px}
pre.json{background:#120d15;border:1px solid var(--edge);border-radius:8px;padding:9px;overflow:auto;
  max-height:340px;margin:0;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--dim);padding:26px;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🌸 ShinobiCore Studio <small id="ver">v0.1</small></div>
    <div id="root-label">загрузка…</div>
    <div class="spacer"></div>
    <span id="conn" class="pill">соединение…</span>
    <button class="btn" id="btn-reload" title="Перечитать все файлы с диска">⟳ Перечитать</button>
    <button class="btn pri" id="btn-save" disabled>💾 Сохранить <span id="save-cnt"></span></button>
  </header>

  <div id="main">
    <nav id="nav"></nav>
    <div id="view"><div class="empty">Загрузка состояния проекта…</div></div>
  </div>

  <footer>
    <span id="f-status">—</span>
    <span class="spacer"></span>
    <span>Ctrl+S — сохранить · всё пишется прямо в <b>src/main/resources</b> · в игре подхватывается командой <span class="kbd">/reload</span></span>
  </footer>
</div>
<div id="toast"></div>
<script src="app.js"></script>
<script src="ext.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Jutsu Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 60px 1fr 180px;
            height: 100vh;
            gap: 2px;
            background: #0f0f1e;
        }
        
        .header {
            grid-column: 1 / -1;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid #0f3460;
        }
        
        .header h1 {
            color: #e94560;
            font-size: 24px;
        }
        
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #e94560;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #e94560;
            color: white;
        }
        
        .btn-primary {
            background: #e94560;
            color: white;
        }
        
        .btn-primary:hover {
            background: #ff6b6b;
        }
        
        .left-panel {
            background: #16213e;
            overflow-y: auto;
            padding: 10px;
        }
        
        .phase-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .phase-tab {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #533483;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .phase-tab.active {
            background: #e94560;
            border-color: #e94560;
        }
        
        .behavior-list {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        
        .behavior-item {
            background: #0f3460;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        
        .behavior-item:hover {
            background: #533483;
            border-left-color: #e94560;
        }
        
        .behavior-item.selected {
            background: #e94560;
            border-left-color: #ff6b6b;
        }
        
        .behavior-name {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 3px;
        }
        
        .behavior-desc {
            font-size: 11px;
            color: #a0a0a0;
        }
        
        .center-panel {
            background: #1a1a2e;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .viewport {
            flex: 1;
            position: relative;
        }
        
        #voxel-canvas {
            width: 100%;
            height: 100%;
        }
        
        .voxel-tools {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(22, 33, 62, 0.9);
            padding: 10px;
            border-radius: 4px;
            display: flex;
            gap: 5px;
        }
        
        .tool-btn {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #533483;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .tool-btn.active {
            background: #e94560;
        }
        
        .right-panel {
            background: #16213e;
            overflow-y: auto;
            padding: 10px;
        }
        
        .param-group {
            margin-bottom: 15px;
        }
        
        .param-group h3 {
            color: #e94560;
            font-size: 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 5px;
        }
        
        .param-item {
            margin-bottom: 10px;
        }
        
        .param-item label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #a0a0a0;
        }
        
        .param-item input[type="number"],
        .param-item input[type="text"],
        .param-item select {
            width: 100%;
            background: #0f3460;
            border: 1px solid #533483;
            color: #e0e0e0;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .param-item input[type="range"] {
            width: 100%;
        }
        
        .bottom-panel {
            grid-column: 1 / -1;
            background: #16213e;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            overflow: hidden;
        }
        
        .timeline {
            padding: 10px;
            overflow-y: auto;
        }
        
        .timeline h3 {
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .pipeline-item {
            background: #0f3460;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .json-preview {
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            background: #0a0a15;
        }
        
        .json-preview h3 {
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .json-content {
            color: #a0a0a0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .color-picker {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .color-swatch.selected {
            border-color: #e94560;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0f0f1e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #533483;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 Shinobi Jutsu Editor</h1>
            <div class="header-buttons">
                <button class="btn" onclick="importBBModel()">📥 Import BBModel</button>
                <button class="btn" onclick="exportBBModel()">📤 Export BBModel</button>
                <button class="btn btn-primary" onclick="exportJSON()"> Export JSON</button>
            </div>
        </div>
        
        <div class="left-panel">
            <div class="phase-tabs" id="phaseTabs"></div>
            <div class="behavior-list" id="behaviorList"></div>
        </div>
        
        <div class="center-panel">
            <div class="viewport">
                <canvas id="voxel-canvas"></canvas>
                <div class="voxel-tools">
                    <button class="tool-btn active" data-tool="place" onclick="setTool('place')">🟦 Place</button>
                    <button class="tool-btn" data-tool="erase" onclick="setTool('erase')">🗑️ Erase</button>
                    <button class="tool-btn" data-tool="color" onclick="setTool('color')">🎨 Color</button>
                    <button class="tool-btn" onclick="clearVoxels()">🗑️ Clear</button>
                </div>
            </div>
        </div>
        
        <div class="right-panel">
            <div id="paramsPanel">
                <h3 style="color: #e94560; margin-bottom: 10px;">Parameters</h3>
                <p style="font-size: 12px; color: #a0a0a0;">Select a behavior to edit parameters</p>
            </div>
            
            <div class="param-group" style="margin-top: 20px;">
                <h3>Voxel Colors</h3>
                <div class="color-picker" id="colorPicker"></div>
            </div>
        </div>
        
        <div class="bottom-panel">
            <div class="timeline">
                <h3>Behavior Pipeline</h3>
                <div id="pipelineList"></div>
            </div>
            <div class="json-preview">
                <h3>JSON Preview</h3>
                <div class="json-content" id="jsonContent"></div>
            </div>
        </div>
    </div>

                { id: 'mod_weather_interaction', name: 'Взаимодействие с погодой', desc: 'Взаимодействие с погодой', params: { weatherType: 'any', weatherEffect: 'enhance' } },

                { id: 'mod_clan_bonus', name: 'Клановый бонус', desc: 'Усиление для клана', params: { clanId: 'uchiha', clanBonus: 0.3 } },
                { id: 'mod_dojutsu_required', name: 'Требование додзюцу', desc: 'Требует активации додзюцу', params: { dojutsuType: 'sharingan', dojutsuStage: 1 } },
                { id: 'mod_sage_mode_bonus', name: 'Бонус режима мудреца', desc: 'Усиление в режиме мудреца', params: { sageModeMultiplier: 2.0 } },
                { id: 'mod_tailed_beast_bonus', name: 'Бонус биджу', desc: 'Усиление от биджу', params: { tailedBeastMultiplier: 2.0 } },
                { id: 'mod_mangekyo_required', name: 'Требование мангекё', desc: 'Требует мангекё', params: { mangekyoAbility: 'amaterasu' } },
                { id: 'mod_eternal_mangekyo', name: 'Вечное мангекё', desc: 'Требует вечное мангекё', params: { eternalMangekyoAbility: 'perfect_susano' } },
                { id: 'mod_rinnegan_required', name: 'Требование риннеган', desc: 'Требует риннеган', params: { rinneganAbility: 'almighty_push' } },
                { id: 'mod_byakugan_required', name: 'Требование бьякуган', desc: 'Требует бьякуган', params: { byakuganAbility: 'gentle_fist' } },
                { id: 'mod_sharingan_required', name: 'Требование шаринган', desc: 'Требует шаринган', params: { sharinganAbility: 'copy' } },
                { id: 'mod_sage_required', name: 'Требование режима мудреца', desc: 'Требует режим мудреца', params: { sageModeRequired: true } },
                { id: 'mod_tailed_beast_required', name: 'Требование биджу', desc: 'Требует биджу', params: { tailedBeastRequired: 'any' } },
                { id: 'mod_kinjutsu', name: 'Киндзюцу', desc: 'Запретная техника', params: { kinjutsuPenalty: 50 } },
                { id: 'mod_forbidden', name: 'Запрет', desc: 'Полностью запретная техника', params: { forbiddenPenalty: 100 } }
            ]
        };

        // ============================================
        // STATE
        // ============================================
        let currentPhase = 'trigger';
        let selectedBehavior = null;
        let currentTool = 'place';
        let selectedColor = '#ff6b35';
        let pipeline = {
            trigger: null,
            delivery: [],
            contact: [],
            area: [],
            status: [],
            duration: [],
            end: [],
            modifier: []
        };
        let voxels = [];

        // ============================================
        // THREE.JS SETUP
        // ============================================
        const canvas = document.getElementById('voxel-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setClearColor(0x1a1a2e);

        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);

        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);

        const voxelGroup = new THREE.Group();
        scene.add(voxelGroup);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };

            if (currentTool === 'place' || currentTool === 'erase') {
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(voxelGroup.children);

                if (currentTool === 'place' && intersects.length > 0) {
                    const intersect = intersects[0];
                    const pos = intersect.point.clone().add(intersect.face.normal.multiplyScalar(0.5));
                    pos.x = Math.round(pos.x);
                    pos.y = Math.round(pos.y);
                    pos.z = Math.round(pos.z);
                    addVoxel(pos.x, pos.y, pos.z, selectedColor);
                } else if (currentTool === 'erase' && intersects.length > 0) {
                    const voxel = intersects[0].object;
                    voxelGroup.remove(voxel);
                    voxels = voxels.filter(v => v.mesh !== voxel);
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                camera.position.x -= deltaX * 0.05;
                camera.position.y += deltaY * 0.05;
                camera.lookAt(0, 0, 0);

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.01;
        });

        function addVoxel(x, y, z, color) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: color });
            const voxel = new THREE.Mesh(geometry, material);
            voxel.position.set(x, y, z);
            voxelGroup.add(voxel);
            voxels.push({ x, y, z, color, mesh: voxel });
        }

        function clearVoxels() {
            while (voxelGroup.children.length > 0) {
                voxelGroup.remove(voxelGroup.children[0]);
            }
            voxels = [];
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tool === tool) {
                    btn.classList.add('active');
                }
            });
        }

        // ============================================
        // UI FUNCTIONS
        // ============================================
        function renderPhaseTabs() {
            const tabsContainer = document.getElementById('phaseTabs');
            tabsContainer.innerHTML = '';
            Object.keys(BEHAVIORS).forEach(phase => {
                const tab = document.createElement('div');
                tab.className = `phase-tab ${phase === currentPhase ? 'active' : ''}`;
                tab.textContent = phase.toUpperCase();
                tab.onclick = () => {
                    currentPhase = phase;
                    renderPhaseTabs();
                    renderBehaviorList();
                };
                tabsContainer.appendChild(tab);
            });
        }

        function renderBehaviorList() {
            const listContainer = document.getElementById('behaviorList');
            listContainer.innerHTML = '';
            BEHAVIORS[currentPhase].forEach(behavior => {
                const item = document.createElement('div');
                item.className = `behavior-item ${selectedBehavior?.id === behavior.id ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="behavior-name">${behavior.name}</div>
                    <div class="behavior-desc">${behavior.desc}</div>
                `;
                item.onclick = () => {
                    selectedBehavior = behavior;
                    renderBehaviorList();
                    renderParams();
                    addToPipeline();
                };
                listContainer.appendChild(item);
            });
        }

        function renderParams() {
            const paramsContainer = document.getElementById('paramsPanel');
            if (!selectedBehavior) {
                paramsContainer.innerHTML = '<h3 style="color: #e94560; margin-bottom: 10px;">Parameters</h3><p style="font-size: 12px; color: #a0a0a0;">Select a behavior to edit parameters</p>';
                return;
            }

            let html = `<h3 style="color: #e94560; margin-bottom: 10px;">${selectedBehavior.name}</h3>`;
            Object.keys(selectedBehavior.params).forEach(key => {
                const value = selectedBehavior.params[key];
                html += `
                    <div class="param-item">
                        <label>${key}</label>
                        <input type="number" value="${value}" step="0.1" onchange="updateParam('${key}', this.value)">
                    </div>
                `;
            });
            paramsContainer.innerHTML = html;
        }

        function updateParam(key, value) {
            if (selectedBehavior) {
                selectedBehavior.params[key] = parseFloat(value);
            }
        }

        function addToPipeline() {
            if (selectedBehavior) {
                if (currentPhase === 'trigger') {
                    pipeline.trigger = { ...selectedBehavior };
                } else {
                    pipeline[currentPhase].push({ ...selectedBehavior });
                }
                renderPipeline();
                updateJSON();
            }
        }

        function renderPipeline() {
            const pipelineContainer = document.getElementById('pipelineList');
            pipelineContainer.innerHTML = '';

            if (pipeline.trigger) {
                const item = document.createElement('div');
                item.className = 'pipeline-item';
                item.innerHTML = `<span>🔥 ${pipeline.trigger.name}</span><button onclick="removeFromPipeline('trigger')">❌</button>`;
                pipelineContainer.appendChild(item);
            }

            ['delivery', 'contact', 'area', 'status', 'duration', 'end', 'modifier'].forEach(phase => {
                pipeline[phase].forEach((behavior, index) => {
                    const item = document.createElement('div');
                    item.className = 'pipeline-item';
                    item.innerHTML = `<span>⚡ ${behavior.name}</span><button onclick="removeFromPipeline('${phase}', ${index})"></button>`;
                    pipelineContainer.appendChild(item);
                });
            });
        }

        function removeFromPipeline(phase, index) {
            if (phase === 'trigger') {
                pipeline.trigger = null;
            } else {
                pipeline[phase].splice(index, 1);
            }
            renderPipeline();
            updateJSON();
        }

        function updateJSON() {
            const jsonContent = document.getElementById('jsonContent');
            jsonContent.textContent = JSON.stringify(pipeline, null, 2);
        }

        // ============================================
        // COLOR PICKER
        // ============================================
        const colors = ['#ff6b35', '#f7931e', '#ffd700', '#00ff00', '#00ffff', '#0080ff', '#8000ff', '#ff0080', '#ff0000', '#ffffff', '#000000', '#808080'];
        const colorPicker = document.getElementById('colorPicker');
        colors.forEach(color => {
            const swatch = document.createElement('div');
            swatch.className = `color-swatch ${color === selectedColor ? 'selected' : ''}`;
            swatch.style.backgroundColor = color;
            swatch.onclick = () => {
                selectedColor = color;
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
            };
            colorPicker.appendChild(swatch);
        });

        // ============================================
        // EXPORT/IMPORT
        // ============================================
        function exportJSON() {
            const dataStr = JSON.stringify(pipeline, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'jutsu.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function importBBModel() {
            alert('BBModel import: Create file input dialog here');
        }

        function exportBBModel() {
            alert('BBModel export: Generate .bbmodel file here');
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // ============================================
        // INIT
        // ============================================
        renderPhaseTabs();
        renderBehaviorList();
        renderParams();
        renderPipeline();
        updateJSON();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        });
    </script>

# SHINOBICORE ANIME PRESET FOR MAKEUP SHADERS
# Цветокоррекция под цвета чакры (Синий/Красный/Желтый)
COLOR_GRADING_ENABLED=true
SATURATION=1.25
CONTRAST=1.1
# Тени как в аниме (жесткие границы)
SHADOW_TYPE=CEL
CEL_SHADING_STRENGTH=0.8
# Частицы (чтобы воксельные снаряды не сливались)
PARTICLE_BILLBOARDING=true
PARTICLE_BLOOM_MULTIPLIER=0.5
